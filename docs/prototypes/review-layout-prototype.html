let variant=new URLSearchParams(location.search).get('variant')==='B'?'B':'A';let activeId=items[0].id;let group='all',status='all',search='',selectedQuote='',quoteItemId='',timer;
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(message){$('#toast').textContent=message;$('#toast').style.display='block';clearTimeout(timer);timer=setTimeout(()=>$('#toast').style.display='none',3200)}
function statusBadge(i){return i.status==='required'?'<span class="badge red">! 需要你判断</span>':i.status==='reviewed'?'<span class="badge green">✓ 已审核</span>':'<span class="badge blue">○ 待审 · 有推荐方案</span>'}
function filtered(){const tags=[...document.querySelectorAll('.facet:checked')].map(x=>x.value);return items.filter(i=>(group==='all'||i.group===group)&&(status==='all'||i.status===status)&&tags.every(t=>i.tags.includes(t))&&[i.id,i.title,i.text].join(' ').toLowerCase().includes(search.toLowerCase()))}
function panel(label,body,extra=''){return `<section class="panel"><div class="panel-label">${label}${extra}</div><div class="panel-body selectable">${body}</div></section>`}
function compare(i){if(i.kind==='formula')return panel('源图 · 局部裁切',`<img class="source-image" src="${imgUri(formulaSvg)}" alt="示意源公式：高斯积分" data-image="formula"><div class="source-caption">示意源图 · 点击放大查看</div>`)+panel('AI 建议 · 公式预览',`<div class="math">${integral}</div><div class="code-label">TeX · 可编辑，草图不联动渲染</div><textarea class="tex" aria-label="TeX 编辑">${esc(i.text)}</textarea>`);if(i.kind==='chart')return panel('源图 · 图表',`<img class="source-image" src="${imgUri(chartSvg)}" alt="示意图表：观测值与基准值" data-image="chart"><div class="source-caption">示意源图 · 点击放大查看</div>`)+panel('AI 提取的说明',`<p>${esc(i.text)}</p><div class="source-caption">实线 / 虚线 · 图例对应关系</div>`);if(i.kind==='term')return panel('原文术语',`<div class="term">${esc(i.left)}</div><div class="term-detail">${i.tags.includes('math')?'领域：数学 / 拓扑学':'类别：专有名称'}</div>`)+panel('建议译名',`<div class="term">${esc(i.right)}</div><div class="term-detail">可接受建议，也可直接编辑译名。</div>`);return panel('修改前',`<p>${i.left}</p>`,'<span>− 删除</span>')+panel('建议修改后',`<p>${i.right}</p>`,'<span>＋ 添加</span>')}
function article(i){return `<article class="review-card" data-item="${i.id}"><div class="item-meta"><span class="mono small muted">${i.id}</span><span class="small muted">${i.type}</span>${statusBadge(i)}</div><h2 class="item-title">${i.title}</h2><p class="item-summary">${i.summary}</p><div class="comparison">${compare(i)}</div><div class="explanation"><strong>修改依据</strong>　${i.reason}</div><details class="source-link"><summary>${i.location}　·　展开上下文与来源</summary><p>${i.context}</p></details><section class="decision"><div class="decision-heading"><label class="decision-label" for="note-${i.id}">你的意见</label><span class="small muted">可划选上方文字并引用</span></div><textarea class="note" id="note-${i.id}" placeholder="写下你的判断、修改理由，或交给 AI 继续处理的要求…">${esc(i.note||'')}</textarea><div class="editable ${i.editing?'open':''}" id="edit-${i.id}"><label class="code-label" for="replacement-${i.id}">直接编辑最终内容</label><textarea class="replacement" id="replacement-${i.id}">${esc(i.custom||i.text)}</textarea><button data-action="custom" class="primary" style="margin-top:12px">使用编辑内容并通过</button></div><div class="decision-actions"><button class="primary" data-action="accept">✓ 接受建议</button><button data-action="keep">保留原文</button><button data-action="edit">直接编辑</button><button class="quiet" data-action="return">交回 AI →</button><span class="state-label">${esc(i.decision||'尚未决定')}</span></div></section><footer class="item-bottom"><span>${items.indexOf(i)+1} / ${items.length}　·　仅演示本条审核</span><button class="next-btn" data-action="next">下一项 →</button></footer></article>`}
function render(){const list=filtered();if(!list.some(i=>i.id===activeId))activeId=list[0]?.id;$('#shell').classList.toggle('flow',variant==='B');document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===variant));$('#view-title').textContent=variant==='A'?'留一点时间，读得更仔细。':'顺着材料，一处一处读下去。';$('#view-description').textContent=variant==='A'?'一次专注一处变化。原始材料、修改理由和你的决定，都在这里。':'完整卡片连续展开。按你的节奏审阅，在每一处材料下留下判断。';$('#queue').innerHTML=`<div class="queue-heading"><span>审核条目</span><span>${list.length} 项</span></div>`+list.map(i=>`<button class="queue-item ${activeId===i.id?'active':''}" data-id="${i.id}"><span class="row"><span class="dot ${i.status==='required'?'red':i.status==='reviewed'?'green':''}"></span><span>${i.id}</span><span>${i.status==='required'?'必审':i.status==='reviewed'?'已审':'待审'}</span></span><div class="queue-title">${i.title}</div><p class="queue-preview">${i.preview}</p></button>`).join('');$('#articles').innerHTML=list.length?(variant==='A'?article(list.find(i=>i.id===activeId)):list.map(article).join('')):'<div class="empty"><h2>这里没有符合条件的材料</h2><p style="margin-top:12px">可以取消一些筛选条件，再继续审阅。</p></div>';const reviewed=items.filter(i=>i.status==='reviewed').length;$('#progress').style.width=reviewed/items.length*100+'%';$('#progress-label').textContent=`${reviewed} / ${items.length} 项已有审核决定`;for(const s of ['pending','required','reviewed'])$('#'+s+'-count').textContent=items.filter(i=>i.status===s).length}
function switchVariant(value){variant=value;const url=new URL(location.href);url.searchParams.set('variant',value);history.replaceState({},'',url);render();notify(value==='A'?'A · 单项专注：侧边条目，一次处理一处':'B · 连续阅读：全部材料按卡片展开')}
document.addEventListener('click',event=>{const v=event.target.closest('[data-variant]');if(v)switchVariant(v.dataset.variant);const q=event.target.closest('[data-id]');if(q){activeId=q.dataset.id;render()}const g=event.target.closest('[data-group]');if(g){group=g.dataset.group;document.querySelectorAll('[data-group]').forEach(b=>b.classList.toggle('active',b===g));render()}const s=event.target.closest('[data-status]');if(s){status=s.dataset.status;document.querySelectorAll('[data-status]').forEach(b=>b.classList.toggle('active',b===s));render()}const im=event.target.closest('[data-image]');if(im){$('#dialog-image').src=im.src;$('#image-dialog').showModal()}const a=event.target.closest('[data-action]');if(!a)return;const card=a.closest('[data-item]'),i=items.find(i=>i.id===card.dataset.item),action=a.dataset.action;if(action==='edit'){i.editing=!i.editing;render();return}if(action==='next'){const list=filtered(),index=list.findIndex(x=>x.id===i.id);activeId=list[(index+1)%list.length].id;render();return}if(action==='return'&&!i.note?.trim()){notify('先写下需要 AI 处理的意见，再交回处理。');card.querySelector('.note').focus();return}i.status='reviewed';i.decision={accept:'已接受建议',keep:'已决定保留原文',custom:'已编辑并通过',return:'已批注 · 待 AI 处理'}[action];i.editing=false;render();notify(i.decision+' · 仅在本次草图中有效')});
document.addEventListener('input',e=>{if(e.target.matches('.note'))items.find(i=>i.id===e.target.closest('[data-item]').dataset.item).note=e.target.value;if(e.target.matches('.replacement'))items.find(i=>i.id===e.target.closest('[data-item]').dataset.item).custom=e.target.value;if(e.target.matches('.tex')){const i=items.find(i=>i.id===e.target.closest('[data-item]').dataset.item);i.custom=e.target.value;i.note='TeX 修改为：\n'+e.target.value;const note=e.target.closest('[data-item]').querySelector('.note');note.value=i.note}});
document.querySelectorAll('.facet').forEach(c=>c.addEventListener('change',render));$('#search').addEventListener('input',e=>{search=e.target.value;render()});$('#previous-variant').onclick=$('#next-variant').onclick=()=>switchVariant(variant==='A'?'B':'A');document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable||$('#image-dialog').open)return;if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();switchVariant(variant==='A'?'B':'A')}});
document.addEventListener('mouseup',e=>{if(e.target.closest('#quote-button'))return;const selection=window.getSelection(),card=e.target.closest('[data-item]');if(!selection||selection.isCollapsed||!card||!e.target.closest('.selectable')){$('#quote-button').style.display='none';return}selectedQuote=selection.toString().trim();if(!selectedQuote)return;quoteItemId=card.dataset.item;const rect=selection.getRangeAt(0).getBoundingClientRect();$('#quote-button').style.left=Math.min(Math.max(8,rect.left),innerWidth-180)+'px';$('#quote-button').style.top=Math.max(8,rect.top-44)+'px';$('#quote-button').style.display='block'});$('#quote-button').addEventListener('mousedown',e=>e.preventDefault());$('#quote-button').onclick=()=>{const i=items.find(x=>x.id===quoteItemId);i.note=(i.note?i.note+'\n\n':'')+'> '+selectedQuote+'\n\n';const note=$('#note-'+i.id);note.value=i.note;note.focus();note.setSelectionRange(note.value.length,note.value.length);$('#quote-button').style.display='none';window.getSelection().removeAllRanges();notify('选中文字已引用到意见框 · 草图演示')};$('#submit-demo').onclick=()=>notify('这是视觉草图，未保存或提交数据。正式版会在这里确认提交范围。');$('#close-dialog').onclick=()=>$('#image-dialog').close();render();
</script></body></html>
